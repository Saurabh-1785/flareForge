[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.25"
optimizer = true
optimizer_runs = 200

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
single_line_statement_blocks = "single"

[rpc_endpoints]
coston2 = "${COSTON2_RPC_URL}"

[etherscan]
coston2 = { key = "${EXPLORER_API_KEY}", url = "https://coston2-explorer.flare.network/api" }
